# Dependabot is here for SECURITY updates only. `open-pull-requests-limit: 0` turns off its routine
# version-update PRs while leaving security updates on: Renovate (renovate.json) opens those, with a
# release-age delay and SHA pinning for actions, so the two tools never open the same bump twice.
#
# Security updates themselves are switched on in the repository settings (Code security), not here;
# this file only sets how their pull requests are titled, so the PR title check accepts them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci(deps)"
    labels: [dependencies, security]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps-dev)"
    labels: [dependencies, security]

  - package-ecosystem: npm
    directory: /bench
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(bench)"
    labels: [dependencies, security]
