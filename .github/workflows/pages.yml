name: Playground

# Builds apps/playground against the package build and publishes it to GitHub Pages:
# https://gabrielstuff.github.io/fzy-search/. Every push to main that can change what the page shows
# deploys it, so the playground always runs the library as it is on main.
on:
  push:
    branches: [main]
    paths:
      - apps/playground/**
      - packages/fzy-search/**
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache: what this job builds is served to every visitor.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '24'
          cache: false
      # Builds fzy-search first (the task depends on it), then the site against that dist/.
      - run: vp run playground#build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write # publish the artifact
      id-token: write # prove to Pages that this workflow built it
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
