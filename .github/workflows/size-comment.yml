name: Size comment

# Posts the numbers that size.yml measured as a comment on the pull request. workflow_run gives this
# job a token that can write to the pull request even when it comes from a fork, so the rule is:
# never run anything the pull request wrote. It checks out the default branch, not the PR, and the
# artifact is read as data: scripts/size-comment.mjs refuses anything that is not a plain integer.
on:
  workflow_run:
    workflows: [Size]
    types: [completed]

permissions: {}

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # download the artifact of the run that triggered this one
      contents: read
      pull-requests: write # the one write this repository gives to a PR comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: size
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Render the comment
        run: node scripts/size-comment.mjs size.json > comment.md
      - name: Post it
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # workflow_run.pull_requests is empty for a fork, so find the PR from the commit.
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" --jq '.[0].number')"
          case "$pr" in ''|*[!0-9]*) echo "::error::no pull request found for ${HEAD_SHA}"; exit 1;; esac
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body-file comment.md
