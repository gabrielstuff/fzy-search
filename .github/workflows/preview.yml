name: Preview

# Every commit on main and every pull request from this repository gets an installable build on
# pkg.pr.new, so a change can be tried in a real project before it is merged or released:
#
#   npm i https://pkg.pr.new/gabrielstuff/fzy-search/fzy-search@<pr-number or sha>
#
# This publishes nothing to npm. Requires the "pkg-pr-new" GitHub App on this repository.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # Branches of this repository only. A pull request from a fork would run its author's code in a
    # job that publishes a package other people install: a maintainer pushes the branch to preview it.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache: this job's output is what people install.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '24'
          cache: false
      - run: vp run fzy-search#build
      # --previewVersion rewrites the version to 0.0.0-preview-<sha>, so a preview can never satisfy
      # a real semver range or collide with a published release in someone's lockfile.
      - run: node_modules/.bin/pkg-pr-new publish ./packages/fzy-search --previewVersion --commentWithSha --packageManager=npm --no-template
