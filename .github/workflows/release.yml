name: Release

# A release is one click: Actions, Release, Run workflow, on main. The version comes from the
# Conventional Commits since the last tag (git-cliff), or from the `bump` input. Bump, tag and publish
# are one job on purpose: a tag pushed with GITHUB_TOKEN does not trigger another workflow, so a
# separate tag-triggered publish job would never run. The same script runs locally: `npm run release`.
#
# Nothing reaches the remote until npm has accepted the package: `prepare` commits and tags locally,
# `push` runs after `npm publish`. Publishing uses npm trusted publishing (OIDC), so no npm token is
# stored anywhere and the package gets a provenance attestation. The npm side is configured once, see
# .github/RELEASING.md. The file name (release.yml) and the environment (npm) are bound to that trust:
# renaming either breaks publishing.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto reads the commits)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry-run:
        description: Print the version and the release notes, then stop before publishing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment can require a reviewer: a release then waits for one click.
    environment: npm
    permissions:
      contents: write # push the release commit and the tag, create the GitHub Release
      id-token: write # npm trusted publishing and provenance
    env:
      BUMP: ${{ inputs.bump }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-cliff reads every tag and commit
          persist-credentials: false
      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14; Node 24 ships a recent enough npm.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Check the npm version floor
        run: |
          npm --version
          printf '%s\n' 11.5.1 "$(npm --version)" | sort -VC || { echo "::error::npm >= 11.5.1 is needed for trusted publishing"; exit 1; }
      - name: Commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Prepare (version, changelog, commit, tag)
        run: |
          args=(--bump "$BUMP")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node scripts/release.mjs prepare "${args[@]}"
      - if: ${{ !inputs.dry-run }}
        run: npm test
      - if: ${{ !inputs.dry-run }}
        run: npm publish --provenance --access public
      - name: Push the release commit and the tag
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs push --remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      - name: GitHub Release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release create "$tag" --verify-tag --title "$tag" --notes "$(npx --no-install git-cliff --latest --strip all)"
