name: Release

# release-please reads the Conventional Commits merged to main, keeps one "chore: release x.y.z"
# pull request open with the version bump and the CHANGELOG, and when that PR is merged it tags the
# release. The publish job then pushes that tag to npm.
#
# Publishing uses npm trusted publishing (OIDC): no npm token is stored anywhere, and the package
# gets a provenance attestation. The npm side is configured once, see .github/RELEASING.md.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A pull request opened with the default token does not trigger CI. Set the repository
          # secret RELEASE_PLEASE_TOKEN (a fine-grained PAT or a GitHub App token with contents and
          # pull-requests write) to get checks on the release PR; without it, merging still works.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment can require a reviewer: a release then waits for one click.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14; Node 24 ships a recent enough npm.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm --version
      # Nothing is installed here: the package has no dependencies, and this job holds the publish credential.
      - run: npm test
      - run: npm run test:smoke
      - run: npm publish --provenance --access public
