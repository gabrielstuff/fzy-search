name: PR title

# Squash merges use the PR title as the commit message, and git-cliff builds the changelog
# and the next version from those messages. A title that is not a Conventional Commit is a
# release note that never gets written, so the title is checked, not trusted.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # Plain pull_request: the title is in the event payload and nothing here needs write access,
      # so there is no reason to run with pull_request_target's privileges. Keep it that way.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            deps
            build
            ci
            chore
            refactor
            test
          requireScope: false
