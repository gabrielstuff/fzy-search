name: PR title

# Squash merges use the PR title as the commit message, and release-please builds the changelog
# and the next version from those messages. A title that is not a Conventional Commit is a
# release note that never gets written, so the title is checked, not trusted.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # pull_request_target runs the base branch's workflow with a read token. This job never
      # checks out or runs the PR's code, which is what makes that safe: keep it that way.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            deps
            build
            ci
            chore
            refactor
            test
          requireScope: false
