name: Bench

# The full benchmark sweep on a GitHub runner, so that results from one known machine sit next to the
# laptop ones: results-<label>.md at the repository root, one file per machine. Run by hand: it takes
# about an hour, Fuse.js most of it. The trust is split as in size.yml: the job that runs the
# contenders' code gets a read-only token and can only upload an artifact; the job that can push and
# open a pull request never runs that code, it commits the two files it downloads.
on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Machine label, for results-<label>.md. Empty: the core count, such as 4vCPU.'
        default: ''
        required: false
      corpora:
        description: 'Corpora to run, comma-separated.'
        default: synthetic,alpaca,abo,overture
        required: true
      skip:
        description: 'Contenders to leave out, comma-separated, such as Fuse.'
        default: ''
        required: false

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '24'
          cache: true
      # The real corpora download themselves on first use and cache under bench/data.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: bench/data
          key: bench-data-${{ hashFiles('bench/realnest.js', 'bench/alpaca.js') }}
      - run: vp run fzy-search#build
      - run: npm ci --prefix bench --ignore-scripts
      - name: Sweep
        env:
          LABEL: ${{ inputs.label }}
          CORPORA: ${{ inputs.corpora }}
          SKIP: ${{ inputs.skip }}
        run: |
          if [ -n "$LABEL" ]; then set -- --label "$LABEL"; else set --; fi
          node bench/sweep.js "$@" --corpora "$CORPORA" --skip "$SKIP"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: |
            results-*.md
            bench/sweep-*.json
          if-no-files-found: error
          retention-days: 30

  # A draft pull request with the result file, for a human to read before it lands.
  publish:
    needs: sweep
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: bench
      - name: Open a draft pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          file=$(ls results-*.md | head -n 1)
          label=${file#results-}; label=${label%.md}
          branch="bench/results-$label-$RUN_ID"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b "$branch"
          git add results-*.md
          git commit -m "docs(bench): results on $label" -m "Generated by the Bench workflow: $RUN_URL"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "HEAD:refs/heads/$branch"
          gh pr create --draft --head "$branch" --title "docs(bench): results on $label" \
            --body "$(printf 'The full sweep on this runner, from the Bench workflow: %s\n\nThe machine, the versions and every table are in the file. The sweep JSON is in the run artifact.' "$RUN_URL")"
